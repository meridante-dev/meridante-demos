name: Leads on Autopilot
on:
  schedule:
    # Monday to Friday, 4 batches/day (times in Lisbon summer = UTC+1; drift +1h in winter WET).
    # Each batch hunts a different city×niche slice (run.py rotates by day+hour) → ~4× the coverage.
    - cron: '15 6 * * 1-5'     # 07:15 Lisbon — morning 1
    - cron: '15 7 * * 1-5'     # 08:15 Lisbon — morning 2
    - cron: '15 8 * * 1-5'     # 09:15 Lisbon — morning 3
    - cron: '15 9 * * 1-5'     # 10:15 Lisbon — morning 4
    - cron: '15 10 * * 1-5'    # 11:15 Lisbon — morning 5 (each a fresh slice: rotation is hour-keyed)
    - cron: '0 12 * * 1-5'     # 13:00 Lisbon — afternoon 1
    - cron: '30 15 * * 1-5'    # 16:30 Lisbon — afternoon 2 (+ daily digest email)
  workflow_dispatch:           # manual "run now" button
    inputs:
      send_digest:
        description: 'Also send the digest email after this run?'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: autopilot
  cancel-in-progress: false
jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free deps
        # requests/bs4 = hunting; websockets/pillow = the digest's website-mockup render (headless Chrome ships on the runner)
        run: pip install requests beautifulsoup4 websockets pillow
      - name: Hunt leads (6 shifts, all free)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}   # free Groq tier; if unset, template emails are used
        run: python autopilot/run.py
      - name: Commit new leads to the cockpit
        run: |
          git config user.name "meridante-autopilot"
          git config user.email "autopilot@meridante.local"
          git add -f _clients.json index.html autopilot/_seen.json autopilot/logs || true
          if git diff --cached --quiet; then
            echo "No new leads this run."
            exit 0
          fi
          git commit -m "Autopilot: new leads ($(date -u +%F_%H%MZ))"
          # rebase-and-retry: 4 batches/day + manual runs race on master, so a plain push loses.
          pushed=0
          for i in 1 2 3 4 5; do
            if git push; then pushed=1; break; fi
            echo "push rejected (attempt $i) — rebasing on remote…"
            git pull --rebase --autostash origin master || true
            sleep $((i * 3))
          done
          if [ "$pushed" = "1" ]; then
            echo "New leads committed — the cockpit redeploys on its next Pages cron (<=20 min)."
          else
            echo "::warning::push still failing after retries; leads are local only this run (next batch re-syncs)."
          fi
      - name: Daily digest email (after the day's last batch, or on manual runs)
        # fires on the 16:30 Lisbon batch + manual runs — one clean summary covering all 4 batches.
        # always() so a transient push race in the commit step never costs the digest.
        # Scheduled 16:30 batch always digests; manual runs only when send_digest=true (no inbox spam).
        if: always() && (github.event.schedule == '30 15 * * 1-5' || github.event.inputs.send_digest == 'true')
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}                 # set this + app password → real HTML email WITH mockup PNGs attached
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }} # Gmail app password (only you can create it)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}             # mockup copy (falls back to templates if unset)
          DIGEST_TO: meridante.pt@gmail.com
          DIGEST_TOKEN: ${{ secrets.DIGEST_TOKEN }}             # fallback: private-inbox issue → GitHub emails it
          DIGEST_REPO: meridante-dev/meridante-inbox
        run: python autopilot/digest.py
