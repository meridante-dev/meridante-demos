name: Deploy cockpit to Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
  # Self-healing: retry every 20 min so the cockpit republishes automatically
  # the moment a GitHub Pages incident clears — no human needed.
  schedule:
    - cron: '*/20 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000        # wait up to 15 min through a degraded queue instead of aborting early
          error_count: 15        # tolerate more transient poll errors before giving up
