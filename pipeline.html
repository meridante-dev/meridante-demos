let OVER=JSON.parse(localStorage.getItem('meridante_pipeline_state')||'{}');
DATA.forEach(d=>Object.assign(d,OVER[d.id]||{}));
function ok(){if(document.getElementById('pw').value==='meridante2026'){localStorage.setItem('meridante_pass','ok');init()}else{document.getElementById('pw').value='';document.getElementById('pw').placeholder='Try again'}}
function init(){document.getElementById('gate').style.display='none';const cty=document.getElementById('cty');[...new Set(DATA.map(d=>d.country).filter(Boolean))].sort().forEach(c=>{const o=document.createElement('option');o.value=o.textContent=c;cty.appendChild(o)});render()}
function eur(n){return '€'+Math.round(n||0).toLocaleString('en-US')}
function kpis(rows){let by={},w=0,cash=0,mrr=0,active=0,won=0,lost=0;STAGES.forEach(s=>by[s[0]]=0);
  rows.forEach(r=>{const st=r.stage||'prospect';by[st]=(by[st]||0)+1;
    if(OPEN.includes(st))w+=(r.deal_value||r.expected_value||0)*(PROB[st]||0);
    cash+=(r.deposit_paid||0)+(r.payments||0);
    if(['won','delivering','active'].includes(st))won++;
    if(st==='active'){mrr+=(r.mrr||0);active++} if(st==='lost')lost++});
  const inplay=OPEN.reduce((a,s)=>a+by[s],0),wr=(won+lost)?Math.round(100*won/(won+lost)):0;
  return {by,w:Math.round(w),cash:Math.round(cash),mrr:Math.round(mrr),active,inplay,wr,arr:Math.round(mrr*12)}}
function upd(id,f,v){(OVER[id]=OVER[id]||{})[f]=v;localStorage.setItem('meridante_pipeline_state',JSON.stringify(OVER));const d=DATA.find(x=>String(x.id)===String(id));if(d)d[f]=v;render()}
function render(){
  const q=document.getElementById('q').value.toLowerCase(),cf=document.getElementById('cty').value;
  const rows=DATA.filter(d=>(!cf||d.country===cf)&&(!q||((d.company||'')+(d.city||'')+(d.sector||'')).toLowerCase().includes(q)));
  const k=kpis(rows);
  document.getElementById('kpis').innerHTML=[['Cash collected',eur(k.cash),1],['MRR',eur(k.mrr),1],['ARR run-rate',eur(k.arr),0],['Active clients',k.active,0],['Weighted pipeline',eur(k.w),1],['Deals in play',k.inplay,0],['Win rate',k.wr+'%',0]].map(([l,v,b])=>`<div class="kpi"><div class="l">${l}</div><div class="v ${b?'big':''}">${v}</div></div>`).join('');
  const byC={};rows.forEach(r=>{const c=r.country||'—';(byC[c]=byC[c]||{n:0,rep:0})?0:0;byC[c].n++;if((r.stage||'')!=='prospect'&&r.stage!=='lost')byC[c].rep++});
  document.getElementById('ctry').innerHTML=Object.entries(byC).sort((a,b)=>b[1].n-a[1].n).map(([c,o])=>`<div class="cc"><b>${c}</b><small>${o.n} leads · ${o.rep} in motion</small></div>`).join('');
  const opts=STAGES.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join('');
  document.getElementById('board').innerHTML=STAGES.map(([key,label])=>{
    const cs=rows.filter(r=>(r.stage||'prospect')===key),val=cs.reduce((a,r)=>a+(r.deal_value||r.expected_value||0),0);
    const cards=cs.slice(0,80).map(r=>`<div class="card"><div class="co">${r.company||''}</div>
      <div class="meta">${[r.city,r.sector].filter(Boolean).join(' · ')} ${r.site_status?`<span class="chip">${r.site_status}</span>`:''}</div>
      <select onchange="upd('${r.id}','stage',this.value)">${opts.replace('value="'+key+'"','value="'+key+'" selected')}</select>
      <div class="mrow"><input type="number" placeholder="deal €" value="${r.deal_value||''}" onchange="upd('${r.id}','deal_value',+this.value)"><input type="number" placeholder="mrr €" value="${r.mrr||''}" onchange="upd('${r.id}','mrr',+this.value)"></div>
      <div class="acts"><a class="${r.gmail?'':'off'}" href="${r.gmail||'#'}" target="_blank">✉ Gmail</a><a class="${r.demo?'':'off'}" href="${r.demo||'#'}" target="_blank">◱ Demo</a></div></div>`).join('');
    const more=cs.length>80?`<div style="padding:8px 12px;color:var(--mut);font-size:11px">+${cs.length-80} more…</div>`:'';
    return `<div class="col"><h3>${label}<span class="c">${cs.length}</span></h3><div class="sum">${eur(val)}</div><div class="cards">${cards}${more}</div></div>`}).join('')}
